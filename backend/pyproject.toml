[project]
name = "thoughtharbor"
version = "0.1.0"
description = "Shared Python application package for ThoughtHarbor"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "httpx>=0.28,<1",
  "mcp>=1.9,<2",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoughtharbor"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_openapi.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["thoughtharbor"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
