name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install backend dependencies
        run: uv sync --directory backend --locked
      - name: Ruff lint
        run: uv run --directory backend ruff check .
      - name: Ruff format
        run: uv run --directory backend ruff format --check .
      - name: Static type checking
        run: uv run --directory backend mypy src
      - name: Python tests
        run: uv run --directory backend pytest
      - name: Alembic CLI sanity check
        run: uv run --directory backend alembic --version

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte and TypeScript checks
        run: pnpm --dir apps/web check
      - name: Unit tests
        run: pnpm --dir apps/web test
      - name: Production build
        run: pnpm --dir apps/web build

  e2e:
    name: Frontend browser smoke test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run Playwright smoke test
        run: pnpm --dir apps/web test:e2e

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --file docker/backend.Dockerfile --tag thought-harbor-backend:ci .
      - name: Build web image
        run: docker build --file docker/web.Dockerfile --tag thought-harbor-web:ci .

  openapi-drift:
    name: OpenAPI and generated client drift
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Check contract artifacts
        run: ./scripts/check-openapi-client-drift.sh
