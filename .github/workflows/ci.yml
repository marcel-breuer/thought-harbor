name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      docker: ${{ steps.paths.outputs.docker }}
      openapi: ${{ steps.paths.outputs.openapi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$EVENT_BEFORE"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "$CURRENT_SHA")"
          fi

          changed_paths="$(git diff --name-only "$base_sha" "$CURRENT_SHA")"

          matches() {
            grep -Eq "$1" <<<"$changed_paths"
          }

          all=false
          backend=false
          frontend=false
          docker=false
          openapi=false

          if matches '(^|/)\.github/workflows/ci\.yml$'; then
            all=true
          fi
          if matches '^(backend/|compose\.yml$|docker/backend\.Dockerfile$|\.github/workflows/ci\.yml$)'; then
            backend=true
          fi
          if matches '^(apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|docker/web\.Dockerfile$|\.github/workflows/ci\.yml$)'; then
            frontend=true
          fi
          if matches '^(backend/|apps/web/|compose\.yml$|docker/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            docker=true
          fi
          if matches '^(backend/|apps/web/src/lib/generated/|scripts/check-openapi-client-drift\.sh|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            openapi=true
          fi

          if [[ "$all" == true ]]; then
            backend=true
            frontend=true
            docker=true
            openapi=true
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docker=$docker"
            echo "openapi=$openapi"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install backend dependencies
        run: uv sync --directory backend --locked
      - name: Ruff lint
        run: uv run --directory backend ruff check .
      - name: Ruff format
        run: uv run --directory backend ruff format --check .
      - name: Static type checking
        run: uv run --directory backend mypy src
      - name: Python tests
        run: uv run --directory backend pytest
      - name: Alembic CLI sanity check
        run: uv run --directory backend alembic --version

  frontend:
    name: Frontend quality
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte and TypeScript checks
        run: pnpm --dir apps/web check
      - name: Unit tests
        run: pnpm --dir apps/web test
      - name: Production build
        run: pnpm --dir apps/web build

  e2e:
    name: Frontend browser smoke test
    needs: [changes, frontend]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.frontend == 'true' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run Playwright smoke test
        run: pnpm --dir apps/web test:e2e

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: >-
      always() && needs.changes.outputs.docker == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      - name: Build backend image
        uses: docker/build-push-action@v6
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: docker/backend.Dockerfile
          tags: thought-harbor-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          file: docker/web.Dockerfile
          tags: thought-harbor-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  openapi-drift:
    name: OpenAPI and generated client drift
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check contract artifacts
        run: ./scripts/check-openapi-client-drift.sh
