name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v0.1.${GITHUB_RUN_NUMBER}"
          git tag "${version}" "${GITHUB_SHA}"
          git push origin "${version}"
          gh release create "${version}" \
            --target "${GITHUB_SHA}" \
            --title "${version}" \
            --generate-notes
