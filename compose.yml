name: thought-harbor

services:
  app-data-init:
    image: alpine:3.21
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /data/files /data/models/whisper /data/models/diarization
        chown -R 10001:10001 /data
    user: "0:0"
    volumes:
      - app_data:/data
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn thoughtharbor.api.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      app-data-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thoughtharbor}:${POSTGRES_PASSWORD:-thoughtharbor}@postgres:5432/${POSTGRES_DB:-thoughtharbor}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3.8}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-ollama}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-qwen3.8}
      AI_EXTRACTION_BASE_URL: ${AI_EXTRACTION_BASE_URL:-}
      AI_EXTRACTION_API_KEY: ${AI_EXTRACTION_API_KEY:-}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-ollama}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
      AI_EMBEDDINGS_BASE_URL: ${AI_EMBEDDINGS_BASE_URL:-}
      AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL_CACHE: ${WHISPER_MODEL_CACHE:-/data/models/whisper}
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED:-false}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-pyannote}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}
      DIARIZATION_MODEL_CACHE: ${DIARIZATION_MODEL_CACHE:-/data/models/diarization}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-change-me}
      TH_ENVIRONMENT: ${TH_ENVIRONMENT:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CLASSIFICATION_AUTO_ACCEPT_THRESHOLD: ${CLASSIFICATION_AUTO_ACCEPT_THRESHOLD:-0.85}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_ROOT: /data/files
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["celery", "-A", "thoughtharbor.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      app-data-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thoughtharbor}:${POSTGRES_PASSWORD:-thoughtharbor}@postgres:5432/${POSTGRES_DB:-thoughtharbor}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3.8}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-ollama}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-qwen3.8}
      AI_EXTRACTION_BASE_URL: ${AI_EXTRACTION_BASE_URL:-}
      AI_EXTRACTION_API_KEY: ${AI_EXTRACTION_API_KEY:-}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-ollama}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
      AI_EMBEDDINGS_BASE_URL: ${AI_EMBEDDINGS_BASE_URL:-}
      AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL_CACHE: ${WHISPER_MODEL_CACHE:-/data/models/whisper}
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED:-false}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-pyannote}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}
      DIARIZATION_MODEL_CACHE: ${DIARIZATION_MODEL_CACHE:-/data/models/diarization}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-change-me}
      TH_ENVIRONMENT: ${TH_ENVIRONMENT:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CLASSIFICATION_AUTO_ACCEPT_THRESHOLD: ${CLASSIFICATION_AUTO_ACCEPT_THRESHOLD:-0.85}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_ROOT: /data/files
    volumes:
      - app_data:/data
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "thoughtharbor.mcp.server"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      app-data-init:
        condition: service_completed_successfully
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      MCP_OWNER_ID: ${MCP_OWNER_ID:-}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thoughtharbor}:${POSTGRES_PASSWORD:-thoughtharbor}@postgres:5432/${POSTGRES_DB:-thoughtharbor}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3.8}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-ollama}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-qwen3.8}
      AI_EXTRACTION_BASE_URL: ${AI_EXTRACTION_BASE_URL:-}
      AI_EXTRACTION_API_KEY: ${AI_EXTRACTION_API_KEY:-}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-ollama}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
      AI_EMBEDDINGS_BASE_URL: ${AI_EMBEDDINGS_BASE_URL:-}
      AI_EMBEDDINGS_API_KEY: ${AI_EMBEDDINGS_API_KEY:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL_CACHE: ${WHISPER_MODEL_CACHE:-/data/models/whisper}
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED:-false}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-pyannote}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}
      DIARIZATION_MODEL_CACHE: ${DIARIZATION_MODEL_CACHE:-/data/models/diarization}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-change-me}
      TH_ENVIRONMENT: ${TH_ENVIRONMENT:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CLASSIFICATION_AUTO_ACCEPT_THRESHOLD: ${CLASSIFICATION_AUTO_ACCEPT_THRESHOLD:-0.85}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_ROOT: /data/files
    volumes:
      - app_data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thoughtharbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thoughtharbor}
      POSTGRES_USER: ${POSTGRES_USER:-thoughtharbor}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_HOST: ollama:11434
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-ollama}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3.8}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-ollama}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-qwen3.8}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-ollama}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
    command:
      - |
        set -eu
        if [ "$${AI_CHAT_PROVIDER}" = "ollama" ]; then ollama pull "$${AI_CHAT_MODEL}"; fi
        if [ "$${AI_EXTRACTION_PROVIDER}" = "ollama" ]; then ollama pull "$${AI_EXTRACTION_MODEL}"; fi
        if [ "$${AI_EMBEDDINGS_PROVIDER}" = "ollama" ]; then ollama pull "$${AI_EMBEDDINGS_MODEL}"; fi
    restart: "no"

volumes:
  app_data:
  ollama_models:
  postgres_data:
  redis_data:
